apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: uds-jit-lifecycle
  version: 0.1.0
components:
  - name: marker
    manifests:
      - name: marker
        namespace: default
        files:
          - marker.yaml
        enableTemplating: true
    actions:
      onCreate:
        before:
          - cmd: echo build >> build-count
