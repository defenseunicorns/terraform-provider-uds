apiVersion: v1
kind: ConfigMap
metadata:
  name: zarf-values
  labels:
{{- with .Values.config.labels }}
{{ toYaml . | nindent 4 }}
{{- end }}
  annotations:
{{- with .Values.config.annotations }}
{{ toYaml . | nindent 4 }}
{{- end }}
data:
  enabled: {{ .Values.config.enabled | quote }}
  message: {{ .Values.config.settings.message | quote }}
  replicas: {{ .Values.config.replicas | quote }}
  secret: {{ .Values.config.settings.secret | quote }}
{{- range $i, $item := .Values.config.items }}
  item-{{ $i }}: {{ $item | quote }}
{{- end }}
