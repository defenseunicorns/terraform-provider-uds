kind: ZarfPackageConfig
metadata:
  name: failed-package
  version: 0.1.0
  description: Acceptance test package for failed deployment recovery

components:
  - name: failed-package
    required: true
    charts:
      - name: failed-package
        releaseName: failed-package
        localPath: chart
        version: 0.1.0
        namespace: failed-package
        values:
          - sourcePath: .failed.failDeployment
            targetPath: .failDeployment
          - sourcePath: .failed.diagnosticValue
            targetPath: .diagnosticValue
