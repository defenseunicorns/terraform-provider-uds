# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/maru-runner/refs/heads/main/tasks.schema.json
includes:
  - common: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.28.1/tasks/lint.yaml

tasks:
  - name: check
    description: "Run the repository lint checks"
    actions:
      - cmd: hk check --all

  - name: fix
    description: "Fix lint findings where supported"
    actions:
      - cmd: hk fix --all

  - name: license
    description: "Check SPDX license headers"
    actions:
      - task: common:license

  - name: fix-license
    description: "Add SPDX license headers to source files"
    actions:
      - task: common:fix-license
