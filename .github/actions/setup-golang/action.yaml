name: Set up Go
description: Set up Go

outputs:
  go-version:
    description: Resolved Go version from setup environment
    value: ${{ steps.setup-go.outputs.go-version }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      id: setup-go
      with:
        go-version-file: "go.mod"
        cache: true
