name: Set up Go
description: Set up Go

outputs:
  go-version:
    description: Resolved Go version from setup environment
    value: ${{ steps.setup-go.outputs.go-version }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      id: setup-go
      with:
        go-version-file: "go.mod"
        cache: true
