name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create release tag
    permissions:
      contents: write # Required to update the release pull request and create its release.
      issues: write # Required to update the release pull request.
      pull-requests: write # Required to update the release pull request.
    runs-on: ubuntu-latest
    # Only run in the upstream repository
    if: github.repository == 'defenseunicorns/terraform-provider-uds'
    outputs:
      release_created: ${{ steps.tag.outputs.release_created }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Create release tag
        id: tag
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Publish release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write # Required by GoReleaser to create the GitHub release.
      packages: write # Required to publish the provider to GHCR.
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      UDS_REGISTRY_USER: ${{ secrets.UDS_REGISTRY_USER }}
      UDS_REGISTRY_TOKEN: ${{ secrets.UDS_REGISTRY_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
