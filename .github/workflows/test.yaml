name: Test
on:
  workflow_call: # allow other workflows to call this one
  pull_request:
    # milestoned is added here as a workaround for release-please not triggering PR workflows (PRs should be added to a milestone to trigger the workflow).
    types: [milestoned, opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

# Abort prior jobs in the same workflow / PR
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-shim:
    name: Docs Shim
    runs-on: ubuntu-latest
    outputs:
      test: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Check for non-documentation changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**.md"
              - "!**.jpg"
              - "!**.png"
              - "!**.gif"
              - "!**.svg"
              - "!.gitignore"
              - "!.vscode/**"
              - "!CODEOWNERS"
              - "!LICENSE"

  lint:
    name: Lint
    needs: docs-shim
    if: needs.docs-shim.outputs.test == 'true'
    runs-on: uds-ubuntu-big-boy-4-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-golang
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint versioning=semver
          version: v2.12.2

  acceptance:
    name: Acceptance tests
    needs: docs-shim
    if: needs.docs-shim.outputs.test == 'true'
    runs-on: uds-ubuntu-big-boy-4-core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@ab842abcad1f7a3305c2538e3dd1950d0daacfa5 # v1.0.1
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.34.3

      - name: Install k3d
        shell: bash
        # renovate: datasource=github-tags depName=k3d-io/k3d versioning=semver
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash

      - name: Setup golang
        uses: ./.github/actions/setup-golang

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # renovate: datasource=github-tags depName=opentofu/opentofu versioning=semver
          tofu_version: v1.12.5
          tofu_wrapper: false

      - name: Run acceptance tests
        run: uds run test-acc

      - name: Save Logs
        uses: defenseunicorns/uds-core/.github/actions/save-logs@bd1f2e4acdb2945ac1887e81668227291f183018
        if: always()
        with:
          suffix: acc

  unit:
    name: Unit tests
    needs: docs-shim
    if: needs.docs-shim.outputs.test == 'true'
    runs-on: uds-ubuntu-big-boy-4-core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@ab842abcad1f7a3305c2538e3dd1950d0daacfa5 # v1.0.1
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.34.3

      - name: Setup golang
        uses: ./.github/actions/setup-golang

      - name: Run unit tests
        run: uds run test-unit

      - name: Save Logs
        uses: defenseunicorns/uds-core/.github/actions/save-logs@bd1f2e4acdb2945ac1887e81668227291f183018
        if: always()
        with:
          suffix: unit
