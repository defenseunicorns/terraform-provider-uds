name: Test
on:
  workflow_call: # allow other workflows to call this one
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.png"
      - "**.gif"
      - "**.svg"
      - "**.tf"
      - "adr/**"
      - "docs/**"
      - "CODEOWNERS"
      - "goreleaser.yml"

permissions:
  contents: read

# Abort prior jobs in the same workflow / PR
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-golang
      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@ab842abcad1f7a3305c2538e3dd1950d0daacfa5 # v1.0.1
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.21.0

      - name: Install k3d
        shell: bash
        # renovate: datasource=github-tags depName=k3d-io/k3d versioning=semver
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.7.5 bash

      - name: Setup golang
        uses: ./.github/actions/setup-golang

      - name: Run acceptance tests
        run: uds run test-acc

      - name: Save Logs
        uses: defenseunicorns/uds-core/.github/actions/save-logs@616fbdb345155e617cc0b1e8b4deebd5ede4e815
        if: always()
        with:
          suffix: acc

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@ab842abcad1f7a3305c2538e3dd1950d0daacfa5 # v1.0.1
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.21.0

      - name: Setup golang
        uses: ./.github/actions/setup-golang

      - name: Run unit tests
        run: uds run test-unit

      - name: Save Logs
        uses: defenseunicorns/uds-core/.github/actions/save-logs@616fbdb345155e617cc0b1e8b4deebd5ede4e815
        if: always()
        with:
          suffix: unit
