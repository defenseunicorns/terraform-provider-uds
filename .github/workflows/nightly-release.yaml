name: Nightly Release
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" ## nightly at 3am UTC

permissions:
  contents: read  # ✅ Ensure GITHUB_TOKEN can read the repository
  packages: write

# Abort prior jobs in the same workflow / PR
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    environment: release-nightly
    #needs: test
    permissions:
      contents: read  # ✅ Fix checkout issues
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Ensure full history is fetched
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}  # ✅ Explicitly pass authentication token

      - name: Setup golang
        uses: ./.github/actions/setup-golang

      - name: Update nightly-unstable tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        run: |
          # A previous release was created using a lightweight tag
          # git describe by default includes only annotated tags
          # git describe --tags includes lightweight tags as well
          DESCRIBE=`git tag -l --sort=-v:refname | grep -v nightly | head -n 1`
          MAJOR_VERSION=`echo $DESCRIBE | awk '{split($0,a,"."); print a[1]}'`
          MINOR_VERSION=`echo $DESCRIBE | awk '{split($0,a,"."); print a[2]}'`
          MINOR_VERSION="$((${MINOR_VERSION} + 1))"
          TAG="${MAJOR_VERSION}.${MINOR_VERSION}.0-nightly"
          # cleanup old release
          gh release delete ${TAG} --cleanup-tag -y || true
          # generate new release
          DATE="$(date +'%Y%m%d')"
          echo "Tag: ${TAG}"
          gh release create \
            -t "${TAG}" \
            --prerelease \
            -n "Nightly unstable build: $DATE"
