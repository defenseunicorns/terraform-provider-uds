name: Nightly Release
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" ## nightly at 3am UTC

permissions: {}

# Abort prior jobs in the same workflow / PR
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Update nightly tag
    runs-on: ubuntu-latest
    environment: release-nightly
    timeout-minutes: 15 # Add timeout to prevent stuck workflows
    permissions:
      contents: write # Required to replace the nightly release and tag through the GitHub API.
    outputs:
      tag_name: ${{ steps.update_tag.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup golang
        uses: ./.github/actions/setup-golang

      - name: Update nightly tag
        id: update_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find latest stable version and increment minor for nightly
          LATEST_STABLE=$(git tag -l --sort=-v:refname | grep -v nightly | head -n 1)
          MAJOR_VERSION=$(echo "$LATEST_STABLE" | awk -F. '{print $1}')
          MINOR_VERSION=$(echo "$LATEST_STABLE" | awk -F. '{print $2}')
          MINOR_VERSION=$((MINOR_VERSION + 1))
          TAG="${MAJOR_VERSION}.${MINOR_VERSION}.0-nightly"

          # Clean up any existing nightly releases/tags
          gh release delete "${TAG}" --cleanup-tag -y || true

          # Ensure the remote tag is deleted in case --cleanup-tag did not remove it
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" || true

          # Recreate the lightweight tag at this workflow's commit
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            --raw-field ref="refs/tags/${TAG}" \
            --raw-field sha="${GITHUB_SHA}"

          # Set output for next job
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  trigger-nightly-release:
    name: Publish nightly release
    needs: nightly
    permissions:
      contents: write # Required by GoReleaser to create the GitHub release.
      packages: write # Required to publish the provider to GHCR.
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.nightly.outputs.tag_name }}
    secrets:
      UDS_REGISTRY_USER: ${{ secrets.UDS_REGISTRY_USER }}
      UDS_REGISTRY_TOKEN: ${{ secrets.UDS_REGISTRY_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
