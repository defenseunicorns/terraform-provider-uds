name: Nightly Release
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" ## nightly at 3am UTC

permissions: {}

# Abort prior jobs in the same workflow / PR
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Create nightly tag
    runs-on: ubuntu-latest
    environment: release-nightly
    timeout-minutes: 15 # Add timeout to prevent stuck workflows
    permissions:
      contents: write # Required to create the nightly tag through the GitHub API.
    outputs:
      tag_name: ${{ steps.update_tag.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Create nightly tag
        id: update_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Base the nightly on the next minor version after the latest stable release.
          LATEST_STABLE=""
          STABLE_TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ $STABLE_TAG_PATTERN ]]; then
              LATEST_STABLE="$candidate"
              break
            fi
          done < <(git tag --list --sort=-v:refname)

          if [[ -z "$LATEST_STABLE" ]]; then
            echo "::error::No stable release tag found"
            exit 1
          fi

          IFS=. read -r MAJOR_VERSION MINOR_VERSION _ <<< "${LATEST_STABLE#v}"
          NEXT_MINOR_VERSION=$((MINOR_VERSION + 1))
          NIGHTLY_DATE=$(date -u +%Y%m%d)
          TAG="v${MAJOR_VERSION}.${NEXT_MINOR_VERSION}.0"
          TAG+="-nightly.${NIGHTLY_DATE}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          # Immutable tags keep nightly artifacts and checksums reproducible.
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            --raw-field ref="refs/tags/${TAG}" \
            --raw-field sha="${GITHUB_SHA}"

          # Set output for next job
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  trigger-nightly-release:
    name: Publish nightly release
    needs: nightly
    permissions:
      contents: write # Required by the reusable release workflow's GoReleaser job.
      packages: write # Required to publish the provider to GHCR.
    uses: $/.github/workflows/release.yml
    with:
      tag_name: ${{ needs.nightly.outputs.tag_name }}
      skip_github_release: true
    secrets:
      UDS_REGISTRY_USER: ${{ secrets.UDS_REGISTRY_USER }}
      UDS_REGISTRY_TOKEN: ${{ secrets.UDS_REGISTRY_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
