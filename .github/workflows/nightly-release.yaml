name: Nightly Release
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" ## nightly at 3am UTC

permissions:
  contents: write
  packages: write

# Abort prior jobs in the same workflow / PR
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    environment: release-nightly
    timeout-minutes: 15 # Add timeout to prevent stuck workflows
    outputs:
      tag_name: ${{ steps.update_tag.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup golang
        uses: ./.github/actions/setup-golang

      - name: Update nightly tag
        id: update_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Find latest stable version and increment minor for nightly
          LATEST_STABLE=$(git tag -l --sort=-v:refname | grep -v nightly | head -n 1)
          MAJOR_VERSION=$(echo "$LATEST_STABLE" | awk -F. '{print $1}')
          MINOR_VERSION=$(echo "$LATEST_STABLE" | awk -F. '{print $2}')
          MINOR_VERSION=$((MINOR_VERSION + 1))
          TAG="${MAJOR_VERSION}.${MINOR_VERSION}.0-nightly"

          # Clean up any existing nightly releases/tags
          gh release delete "${TAG}" --cleanup-tag -y || true

          # Ensure tag is deleted locally and remotely (in case --cleanup-tag didn't work)
          git tag -d "${TAG}" 2>/dev/null || true
          git push origin --delete "${TAG}" 2>/dev/null || true

          # Create new tag and push it
          git tag "${TAG}"
          git push origin "${TAG}"

          # Set output for next job
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  trigger-nightly-release:
    needs: nightly
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.nightly.outputs.tag_name }}
    secrets:
      UDS_REGISTRY_USER: ${{ secrets.UDS_REGISTRY_USER }}
      UDS_REGISTRY_TOKEN: ${{ secrets.UDS_REGISTRY_TOKEN }}
