name: Unit Tests
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.png"
      - "**.gif"
      - "**.svg"
      - "**.tf"
      - "adr/**"
      - "docs/**"
      - "CODEOWNERS"
      - "goreleaser.yml"

permissions:
  contents: read

# Abort prior jobs in the same workflow / PR
concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup golang
        uses: ./.github/actions/setup-golang

      - name: Run unit tests
        run: go test -v -cover -timeout=120s -parallel=10 ./...

      - name: Save Logs
        uses: defenseunicorns/uds-core/.github/actions/save-logs@129864213a0da9ebd887e93e70fa1f0454bdbe9c
        if: always()
        with:
          suffix: unit
