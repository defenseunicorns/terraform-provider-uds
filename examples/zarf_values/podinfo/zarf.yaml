kind: ZarfPackageConfig
metadata:
  name: podinfo
  version: 0.1.0
  description: Podinfo package for demonstrating UDS package Zarf values

values:
  files:
    - values.yaml
  schema: values.schema.json

components:
  - name: podinfo
    required: true
    images:
      - ghcr.io/stefanprodan/podinfo:6.15.0
    charts:
      - name: podinfo
        version: 6.15.0
        namespace: podinfo
        url: oci://ghcr.io/stefanprodan/charts/podinfo
        values:
          - sourcePath: .logLevel
            targetPath: .logLevel
          - sourcePath: .service.enabled
            targetPath: .service.enabled
          - sourcePath: .pod.annotations
            targetPath: .podAnnotations
          - sourcePath: .pod.replicaCount
            targetPath: .replicaCount
          - sourcePath: .pod.tolerations
            targetPath: .tolerations
          - sourcePath: .ui.color
            targetPath: .ui.color
