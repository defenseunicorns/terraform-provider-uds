includes:
  - provider: tasks/build.yaml
  - test: tasks/test.yaml
  - lint: tasks/lint.yaml

variables:
  - name: TOFU_DIR
    default: examples/zarf_values

tasks:
  - name: default
    description: "Run lint checks and unit tests"
    actions:
      - task: lint:check
      - task: test:unit

  - name: build
    description: "Build the provider binary"
    actions:
      - task: provider:build

  - name: lint
    description: "Lint the code"
    actions:
      - task: lint:check

  - name: test
    description: "Run the tests"
    actions:
      - cmd: uds run test:all

  - name: generate
    description: "Format examples and regenerate provider documentation"
    actions:
      - task: provider:generate

  - name: test-unit
    description: "Run unit tests for the project"
    actions:
      - task: test:unit

  - name: setup-cluster
    description: "Create the local k3d/UDS test cluster"
    actions:
      - task: test:setup-cluster

  - name: e2e
    description: "Create the test cluster and run end-to-end tests"
    actions:
      - task: test:setup-cluster
      - task: test:e2e

  - name: tofu:plan
    description: "Plan using the locally built provider"
    actions:
      - cmd: uds run provider:dev
      - cmd: TF_CLI_CONFIG_FILE="$(pwd)/.tofurc.dev" tofu -chdir=${TOFU_DIR} plan

  - name: tofu:apply
    description: "Apply using the locally built provider"
    actions:
      - cmd: uds run provider:dev
      - cmd: TF_CLI_CONFIG_FILE="$(pwd)/.tofurc.dev" tofu -chdir=${TOFU_DIR} apply

  - name: tofu:destroy
    description: "Destroy using the locally built provider"
    actions:
      - cmd: uds run provider:dev
      - cmd: TF_CLI_CONFIG_FILE="$(pwd)/.tofurc.dev" tofu -chdir=${TOFU_DIR} destroy
