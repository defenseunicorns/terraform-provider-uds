tasks:
  - name: default
    description: "Run the default tasks"
    actions:
      - task: lint
      - task: install
      - task: generate

  - name: build
    description: "Compile the provider"
    actions:
      - cmd: go build -v ./...

  - name: install
    description: "Install the provider"
    actions:
      - cmd: go install -v ./...

  - name: lint
    description: "Lint the code"
    actions:
      - cmd: golangci-lint run

  - name: test
    description: "Run the tests"
    actions:
      - cmd: go test -v -cover -timeout=120s -parallel=10 ./...

  - name: generate
    description: "Generate the code"
    actions:
      - cmd: go generate ./...

  - name: test-unit
    description: "Run unit tests for the project"
    actions:
      - cmd: go test -v -cover -timeout 10m ./internal/...

  - name: create-k3d-cluster
    actions:
      - description: "Create the K3d cluster"
        # renovate: datasource=github-tags depName=defenseunicorns/uds-k3d versioning=semver
        cmd: "uds zarf package deploy oci://defenseunicorns/uds-k3d:0.19.5 --confirm --no-progress"

  - name: test-acc
    description: "Run Acceptance Tests"
    actions:
      - task: create-k3d-cluster
      # Point terraform-plugin-testing at the local tofu CLI and resolve the
      # in-process provider against registry.opentofu.org rather than the
      # Terraform legacy address.
      # See https://opentofu.org/docs/language/providers/#running-acceptance-tests-with-opentofu-cli
      - cmd: |
          TF_BIN="$(command -v tofu)" || {
            echo "tofu not found in PATH; install OpenTofu (https://opentofu.org/docs/intro/install/)" >&2
            exit 1
          }
          TF_ACC=1 \
            TF_ACC_TERRAFORM_PATH="$TF_BIN" \
            TF_ACC_PROVIDER_NAMESPACE=hashicorp \
            TF_ACC_PROVIDER_HOST=registry.opentofu.org \
            go test -v -cover -timeout 10m ./test/acc/...
