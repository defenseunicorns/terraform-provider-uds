includes:
  - build-tasks: tasks/build.yaml
  - test-tasks: tasks/test.yaml
  - lint-tasks: tasks/lint.yaml

variables:
  - name: TOFU_DIR
    default: ""

tasks:
  - name: default
    description: "Run lint checks and unit tests"
    actions:
      - task: lint
      - task: test-unit

  - name: build
    description: "Build and configure the provider for local OpenTofu development"
    actions:
      - task: build-tasks:local
      - task: build-tasks:configure

  - name: configure
    description: "Configure OpenTofu to use the local provider build"
    actions:
      - task: build-tasks:configure

  - name: generate
    description: "Format examples and regenerate provider documentation"
    actions:
      - task: build-tasks:generate

  - name: lint
    description: "Lint the code"
    actions:
      - task: lint-tasks:check

  - name: lint-fix
    description: "Fix lint findings where supported"
    actions:
      - task: lint-tasks:fix

  - name: test
    description: "Run tests across all Go packages (acceptance tests are compiled but skipped)"
    actions:
      - task: test-tasks:all

  - name: test-unit
    description: "Run unit tests in internal packages"
    actions:
      - task: test-tasks:unit

  - name: test-acc
    description: "Create the test cluster and run acceptance tests"
    actions:
      - task: test-tasks:setup-cluster
      - task: test-tasks:acc

  - name: test-acc-reuse
    description: "Run acceptance tests against the existing test cluster"
    actions:
      - task: test-tasks:acc

  - name: setup-cluster
    description: "Create the local k3d/UDS test cluster"
    actions:
      - task: test-tasks:setup-cluster

  - name: dev-plan
    description: "Plan using the locally built provider"
    actions:
      - cmd: |
          if [ -z "${TOFU_DIR}" ]; then
            echo "TOFU_DIR is required. Example: uds run dev-plan --set TOFU_DIR=examples/zarf_values"
            exit 1
          fi
          if [ -z "${TF_CLI_CONFIG_FILE}" ]; then
            echo "TF_CLI_CONFIG_FILE is required. Activate mise in your shell before running this task."
            exit 1
          fi
      - task: build
      - cmd: tofu -chdir=${TOFU_DIR} plan

  - name: dev-apply
    description: "Apply using the locally built provider"
    actions:
      - cmd: |
          if [ -z "${TOFU_DIR}" ]; then
            echo "TOFU_DIR is required. Example: uds run dev-plan --set TOFU_DIR=examples/zarf_values"
            exit 1
          fi
          if [ -z "${TF_CLI_CONFIG_FILE}" ]; then
            echo "TF_CLI_CONFIG_FILE is required. Activate mise in your shell before running this task."
            exit 1
          fi
      - task: build
      - cmd: tofu -chdir=${TOFU_DIR} apply

  - name: dev-destroy
    description: "Destroy using the locally built provider"
    actions:
      - cmd: |
          if [ -z "${TOFU_DIR}" ]; then
            echo "TOFU_DIR is required. Example: uds run dev-plan --set TOFU_DIR=examples/zarf_values"
            exit 1
          fi
          if [ -z "${TF_CLI_CONFIG_FILE}" ]; then
            echo "TF_CLI_CONFIG_FILE is required. Activate mise in your shell before running this task."
            exit 1
          fi
      - task: build
      - cmd: tofu -chdir=${TOFU_DIR} destroy
