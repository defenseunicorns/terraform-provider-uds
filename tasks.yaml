includes:
  - build: tasks/build.yaml
  - test: tasks/test.yaml
  - lint: tasks/lint.yaml

variables:
  - name: TOFU_DIR
    default: ""

tasks:
  - name: default
    description: "Run lint checks and unit tests"
    actions:
      - task: lint:check
      - task: test:unit

  - name: build
    description: "Build and configure the provider for local OpenTofu development"
    actions:
      - cmd: uds run build:local
      - cmd: uds run build:configure

  - name: lint
    description: "Lint the code"
    actions:
      - task: lint:check

  - name: test
    description: "Run the tests"
    actions:
      - cmd: uds run test:all

  - name: generate
    description: "Format examples and regenerate provider documentation"
    actions:
      - cmd: uds run build:generate

  - name: test-unit
    description: "Run unit tests for the project"
    actions:
      - task: test:unit

  - name: setup-cluster
    description: "Create the local k3d/UDS test cluster"
    actions:
      - task: test:setup-cluster

  - name: test-acc
    description: "Create the test cluster and run acceptance tests"
    actions:
      - task: test:setup-cluster
      - task: test:acc

  - name: dev-plan
    description: "Plan using the locally built provider"
    actions:
      - cmd: |
          if [ -z "${TOFU_DIR}" ]; then
            echo "TOFU_DIR is required. Example: uds run dev-plan --set TOFU_DIR=examples/zarf_values"
            exit 1
          fi
      - cmd: uds run build
      - cmd: tofu -chdir=${TOFU_DIR} plan

  - name: dev-apply
    description: "Apply using the locally built provider"
    actions:
      - cmd: |
          if [ -z "${TOFU_DIR}" ]; then
            echo "TOFU_DIR is required. Example: uds run dev-plan --set TOFU_DIR=examples/zarf_values"
            exit 1
          fi
      - cmd: uds run build
      - cmd: tofu -chdir=${TOFU_DIR} apply

  - name: dev-destroy
    description: "Destroy using the locally built provider"
    actions:
      - cmd: |
          if [ -z "${TOFU_DIR}" ]; then
            echo "TOFU_DIR is required. Example: uds run dev-plan --set TOFU_DIR=examples/zarf_values"
            exit 1
          fi
      - cmd: uds run build
      - cmd: tofu -chdir=${TOFU_DIR} destroy
