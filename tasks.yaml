includes:
  - test: tasks/acctests.yaml

tasks:
  - name: default
    description: Run the default tasks
    actions:
      - task: fmt
      - task: lint
      - task: install
      - task: generate

  - name: build
    description: Compile the provider
    actions:
      - cmd: go build -v ./...

  - name: install
    description: Install the provider
    actions:
      - cmd: go install -v ./...

  - name: lint
    description: Lint the code
    actions:
      - cmd: golangci-lint run

  - name: fmt
    description: Format the code
    actions:
      - cmd: gofmt -s -w -e .

  - name: test
    description: Run the tests
    actions:
      - cmd: go test -v -cover -timeout=120s -parallel=10 ./...

  - name: generate
    description: Generate the code
    actions:
      - cmd: cd tools; go generate ./...
